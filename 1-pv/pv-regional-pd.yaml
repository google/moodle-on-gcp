---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-regional-pd
spec:
  capacity:
    storage: 200Gi
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteOnce
  storageClassName: ""
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/<YOUR-PROJECT-ID>/regions/<YOUR-REGION>/disks/moodle-regional-pd
    fsType: ext4
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.gke.io/zone
          operator: In
          values:
          - <YOUR-ZONE>
          - <YOUR-REPLICA-ZONE>
