---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: ingress-backendconfig
  namespace: moodle
spec:
  timeoutSec: 300
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 10
    port: 8080
    type: HTTP
    requestPath: /healthz
  logging:
    enable: false
    sampleRate: 0.1 # 0.1 means only 10% will be logged, 1 all will be logged
  # Uncomment when a Cloud Armor security policy exists and you want to apply it to the LB
  # securityPolicy:
  #   name: "moodle-armor-policy"
  # Cloud CDN configured for functional Moodle:
  # Uses USE_ORIGIN_HEADERS so Cloud CDN strictly caches public versioned Moodle assets
  # (/theme/styles.php, /theme/image.php, /lib/javascript.php, /lib/requirejs.php, static files)
  # where NGINX sets Cache-Control: "public, max-age=..., immutable" and strips Set-Cookie,
  # while never caching private course files (/pluginfile.php) or authenticated PHP pages.
  cdn:
    enabled: true
    cacheMode: USE_ORIGIN_HEADERS
    negativeCaching: false
    serveWhileStale: 86400
    cachePolicy:
      includeHost: true
      includeProtocol: true
      includeQueryString: true
      # queryStringBlacklist: []
      # queryStringWhitelist: []
  customResponseHeaders:
    headers:
      - "X-Cache-Status: {cdn_cache_status}"
      - "X-Cache-Pop: {cdn_cache_id}"
