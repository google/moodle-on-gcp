version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/4-moodle-image-builder"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The Alpine base image is bumped by .github/workflows/moodle-semver-updater.yml
      # together with Moodle releases (single pull request), and only to releases
      # whose repositories still ship every php83-* package the image installs.
      - dependency-name: "alpine"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
