## Security settings
add_header X-Served-By "ACME"; # Customize this value with your organization name or a generic identifier to hide PHP version details.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Feature-Policy "geolocation *;midi *;sync-xhr *;microphone *;camera *;magnetometer *;gyroscope *;fullscreen *;payment *;";
add_header Expect-CT 'enforce; max-age=3600';
add_header Etag $upstream_http_etag;

## Restrictions
# Route missing favicon requests to an empty GIF and disable access/error logging for favicon.ico.
location = /favicon.ico {
	log_not_found off;
	access_log off;
	error_page 404 = @empty;
	expires max;
}

location @empty {
	empty_gif;
}

# Disable access and not-found logging for robots.txt
location = /robots.txt {
	allow all;
	log_not_found off;
	access_log off;
}

# Hide all dot files but allow "Well-Known URIs" as per RFC 5785
location ~ /\.(?!well-known).* {
	return 404;
}

# This should be after the php fpm rule and very close to the last nginx ruleset.
# Don't allow direct access to various internal files. See MDL-69333
location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml) {
	deny all;
	return 404;
}
