worker_processes auto;
error_log stderr warn;
pid /run/nginx.pid;

user www www;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Define custom log format to include response times
  log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        '$request_time $upstream_response_time $pipe $upstream_cache_status';

  access_log /dev/stdout main_timed buffer=32k;
  error_log /dev/stderr notice;

  keepalive_timeout 65;

  # Write temporary files to /tmp so they can be created as a non-privileged user
  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  # Default server definition
  server {
    listen 8080 default_server;
    server_name _;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Increase proxy and FastCGI buffers for large Moodle headers and payloads
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # Upload limit (dynamically overridden via setup_moodle.sh when NGINX_CLIENT_MAX_BODY_SIZE is set)
    client_max_body_size 50M;
    client_body_buffer_size 512k;

    root /var/www/html/moodle;
    index index.php index.html;

    location /healthz {
      access_log off;
      return 200 "Healthy\n";
    }

    location / {
      # First attempt to serve request as file, then as directory,
      # then fall back to Moodle 5.0+ Routing Engine (/r.php)
      try_files $uri $uri/ /r.php;
    }

    # Redirect server error pages to the static page /50x.html
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /var/lib/nginx/html;
    }

    # add x-sendfile paths from moodle to nginx (^~ prevents regex static locations from hijacking internal X-Accel-Redirect URIs)
    location ^~ /localcachedir/ {
      internal;
      alias /tmp/moodle/localcache/;
    }

    location ^~ /dataroot/ {
      internal;
      alias /moodledata/;
    }

    # Cloud CDN: Public versioned Moodle PHP asset loaders (CSS, JS, images, fonts, RequireJS, YUI combo)
    # Strips Set-Cookie so Google Cloud CDN can cache public revisioned Moodle assets at the edge
    location ~ ^/(theme/(styles|image|font|javascript|yui_combo)\.php|lib/(javascript|requirejs)\.php)(/|$) {
      fastcgi_split_path_info ^(.+\.php)(/.+)$;
      include fastcgi_params;
      fastcgi_param PATH_INFO $fastcgi_path_info;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_index index.php;
      fastcgi_pass unix:/var/run/php8.3-fpm-moodle.sock;
      fastcgi_read_timeout 300;
      fastcgi_hide_header Set-Cookie;
      fastcgi_hide_header Pragma;
      fastcgi_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cloud CDN safety: Never cache authenticated file endpoints or login/repository handlers publicly
    # fastcgi_request_buffering off streams large uploads directly to PHP-FPM without duplicating 10GB+ files in /tmp/nginx/client_temp
    location ~ ^/(pluginfile\.php|draftfile\.php|tokenpluginfile\.php|webservice/pluginfile\.php|webservice/upload\.php|repository/|login/)(/|$|.*) {
      fastcgi_split_path_info ^(.+\.php)(/.+)$;
      include fastcgi_params;
      fastcgi_param PATH_INFO $fastcgi_path_info;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_index index.php;
      fastcgi_pass unix:/var/run/php8.3-fpm-moodle.sock;
      fastcgi_read_timeout 3600;
      fastcgi_request_buffering off;
      fastcgi_hide_header Cache-Control;
      add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
    }

    # Pass general PHP scripts to PHP-FPM
    # try_files $fastcgi_script_name /r.php routes legacy .php paths removed from disk (Moodle 5.0+ nofile_shim routes) to /r.php
    location ~ [^/]\.php(/|$) {
      fastcgi_split_path_info ^(.+\.php)(/.+)$;
      try_files $fastcgi_script_name /r.php;
      include fastcgi_params;
      fastcgi_param PATH_INFO $fastcgi_path_info;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_index index.php;
      fastcgi_pass unix:/var/run/php8.3-fpm-moodle.sock;
      fastcgi_read_timeout 1200;
    }

    # Hide all dot files but allow "Well-Known URIs" as per RFC 5785
    location ~ /\.(?!well-known).* {
      return 404;
    }

    # This should be after the php fpm rule and very close to the last nginx ruleset.
    # Don't allow direct access to various internal files. See MDL-69333
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml|doesnotexist|\.bak$) {
      deny all;
      return 404;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot|webp|xml)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }

    # Deny access to . files, for security
    location ~ /\. {
      log_not_found off;
      deny all;
    }

    # Allow fpm ping and status from localhost
    location ~ ^/(fpm-status|fpm-ping)$ {
      access_log on;
      allow 127.0.0.1;
      deny all;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass unix:/var/run/php8.3-fpm-moodle.sock;
      fastcgi_read_timeout 300;
    }
  }

  # Include other server configs
  include /etc/nginx/conf.d/*.conf;

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css text/js text/xml application/json application/javascript application/xml application/xml+rss application/x-javascript text/javascript image/svg+xml;
  gzip_vary on;
  gzip_disable "msie6";
}
