---
apiVersion: v1
kind: ConfigMap
metadata:
  name: moodle-configmap-uploads
  namespace: moodle
data:
  MOODLE_URL: 'https://github.com/moodle/moodle/archive/refs/tags/v5.2.4.tar.gz'
  MOODLE_SHA256: ''
  MOOSH_URL: 'https://github.com/tmuras/moosh/archive/refs/heads/master.tar.gz'
  MOOSH_SHA256: ''
  SITE_URL: "http://moodle.<YOUR-LOAD-BALANCER-IP>.nip.io"
  LANG: "pt_BR.UTF-8"
  LANGUAGE: "pt_BR.UTF-8"
  MOODLE_LANGUAGE: "pt_br"
  MOODLE_DATAROOT_PATH: "/moodleroot-instance1/moodledata"
  MOODLE_PATH: "/moodleroot-instance1/moodle"
  DB_TYPE: "mysqli"
  DB_HOST: "<MOODLE_CLOUD_SQL_PRIVATE_IP>"
  DB_HOST_PORT: "3306"
  DB_NAME: "moodle"
  DB_USER: "root"
  DB_PREFIX: "mdl_"
  MOODLE_SITENAME: "Moodle 5.2.4 On GKE"
  MOODLE_SITESUMMARY: "Welcome to Moodle on Google Cloud using GKE!"
  MOODLE_USERNAME: "admin"
  MOODLE_EMAIL: "user@example.org"
  DB_READ_REPLICA_HOST: ""
  DB_READ_REPLICA_PORT: ""
  DB_READ_REPLICA_USER: ""
  DB_READ_REPLICA_PASSWORD: ""
  REDIS_SESSION_ID_HOST: "<YOUR-REDIS-SESSION-IP>"
  REDIS_SESSION_ID_PORT: "6379"
  REDIS_SESSION_ID_AUTH_STRING: "<YOUR-REDIS-SESSION-AUTH-STRING>"
  REDIS_APP_IP_AND_PORT: "<YOUR-REDIS-APP-IP>:6379"
  REDIS_APP_AUTH_STRING: "<YOUR-REDIS-APP-AUTH-STRING>"
  REDIS_SESSION_IP_AND_PORT: "<YOUR-REDIS-SESSION-IP>:6379"
  REDIS_SESSION_AUTH_STRING: "<YOUR-REDIS-SESSION-AUTH-STRING>"
  REDIS_LOCK_HOST_AND_PORT: "<YOUR-REDIS-LOCK-IP>:6379"
  REDIS_LOCK_AUTH_STRING: "<YOUR-REDIS-LOCK-AUTH-STRING>"
  SSLPROXY: "false"
  NOEMAIL_EVER: "true"
  SMTP_HOST: "<YOUR-SMTP-SERVER>"
  SMTP_PORT: "587"
  SMTP_USER: "<YOUR-SMTP-USER>"
  SMTP_PASSWORD: "<REPLACE_WITH_YOUR_SMTP_PASSWORD>"
  SMTP_PROTOCOL: "tls"
  MOODLE_MAIL_NOREPLY_ADDRESS: "<YOUR-NOREPLY-ADDRESS>"
  MOODLE_MAIL_PREFIX: "[Moodle on GKE]"
  CLIENT_MAX_BODY_SIZE: "10G"
  UPLOAD_MAX_FILESIZE: "10G"
  POST_MAX_SIZE: "10G"
  PHP_MAX_EXECUTION_TIME: "3600"
  PHP_MAX_INPUT_TIME: "3600"
  PHP_MEMORY_LIMIT: "1024M"
  PHP_FPM_MAX_CHILDREN: "1"
